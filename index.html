<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo do Amor 💘</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>💞 Encontre as Mensagens que fiz para voce meu Amor 💞</h1>
    <p>Toque nos corações e descubra frases românticas escondidas 💌</p>
  </header>

  <section class="game-area" id="gameArea">
    <!-- Os corações serão gerados dinamicamente -->
  </section>

  <div id="popup" class="popup hidden">
    <div class="popup-content">
      <p id="loveMessage"></p>
      <button id="closeBtn">Fechar 💕</button>
    </div>
  </div>

  <footer>
    <p>Feito com ❤️ para alguém especial</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
